name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-audit:
    # Use a runner with permitted unprivileged namespaces. Ubuntu 24.04
    # restricts them by default; do not disable its host security policy.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.17.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install local-tool and browser sandbox dependencies
        run: sudo apt-get install -y ripgrep bubblewrap

      - name: Run unit tests
        env:
          AI_CHAT_REQUIRE_BROWSER_CONTAINMENT: "1"
        run: npm test

      - name: Run production dependency audit
        run: npm audit --omit=dev
