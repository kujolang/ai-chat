name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-and-audit:
    # Use a runner with permitted unprivileged namespaces. Ubuntu 24.04
    # restricts them by default; do not disable its host security policy.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        node: [22.23.4, 24.22.1, 26.12.1]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install local-tool and browser sandbox dependencies
        run: sudo apt-get install -y ripgrep bubblewrap

      - name: Run unit tests
        env:
          AI_CHAT_REQUIRE_BROWSER_CONTAINMENT: "1"
        run: npm test

      - name: Run production dependency audit
        run: npm audit --omit=dev
