name: "AI Chat launch readiness review"
goal: "Keep AI Chat locally release-ready as a local multi-provider chat showcase with offline fixture validation and explicit live-provider/deployment blockers."
version: "1.0.0"
background: "AI Chat is part of the Kujo prelaunch matrix. The verified scope is local Node/SQLite app behavior, offline Kujo bridge execution, authenticated local smoke checks, and security/release documentation; live provider access and deployed operations require separate target-environment proof."
scope: "Repository-local tests, offline smoke behavior, package audit, API/security docs, setup examples, release checklist alignment, and launch evidence capture."
non_goals:
  - "Using live provider credentials"
  - "Deploying or exposing hosted service instances"
  - "Publishing packages or public releases"
  - "Pushing final release tags"
  - "Claiming production-certified chat platform or enterprise-ready product status"
relevant_systems:
  - "Node.js 22.17.0"
  - "Kujo runtime"
  - "AI SDK source checkout"
  - "SQLite local state"
  - "prelaunch launch evidence packet"
likely_files:
  - "README.md"
  - "SETUP_AND_INSTALL.md"
  - ".env.example"
  - "bridge_chat.kujo"
  - "server.js"
  - "lib/server-runtime.js"
  - "lib/tool-runtime.js"
  - "scripts/smoke-test.js"
  - "docs/API_CONTRACT.md"
  - "docs/RELEASE_CHECKLIST.md"
  - "tests/"
acceptance_criteria:
  - "`npm test` passes under Node.js 22.17.0."
  - "`npm audit --omit=dev` reports no unresolved vulnerabilities."
  - "An authenticated offline fixture smoke check passes against a local loopback server without live provider credentials."
  - "`npm run db:backup` and `npm run db:vacuum` pass against a temporary local SQLite path."
  - "Docs state AI Chat is a local showcase and do not imply production-certified, universal enterprise, or live-provider readiness without target proof."
  - "ShipCheck and Concord pass locally, with ChangeBucket/PatchBrief evidence captured for meaningful launch-readiness changes."
eval_requirements:
  - description: "Run the unit and contract test suite."
    check_type: "command"
    params:
      command: "npm test"
  - description: "Run the production dependency audit."
    check_type: "command"
    params:
      command: "npm audit --omit=dev"
risks:
  - risk: "Live provider, Watchdog, browser, and deployment behavior depends on credentials, local services, Chromium, and target infrastructure."
    mitigation: "Keep local proof provider-free and record target-environment proof as an external blocker."
    severity: "high"
  - risk: "Pre-existing untracked user files are present in this checkout."
    mitigation: "Preserve them untouched and commit only launch-readiness files changed by this review."
    severity: "medium"
dependencies:
  - "Node.js 22.17.0"
  - "npm 9+"
  - "kujo on PATH"
  - "AI_SDK_PATH containing ai_sdk.kujo and providers.kujo"
review_expectations:
  - "Review API/SSE contracts before changing route behavior or stream event payloads."
  - "Review README, setup, release, and security docs for any wording that implies live-provider, deployed, production-certified, or enterprise-ready status without proof."
human_approval_points:
  - "Before using live provider credentials"
  - "Before deploying or exposing an instance beyond loopback"
  - "Before publishing packages or public releases"
  - "Before pushing final release tags"
priority: "high"
tags:
  - "kujo"
  - "ai-chat"
  - "launch-readiness"
